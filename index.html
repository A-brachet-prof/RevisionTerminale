function startJeu(mode){
  jx.mode=mode;
  if(mode==='frise'){
    const items=[...FRISE_EVENTS];
    for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
    jx.frise={items,dragging:null,checked:false,score:0};
  } else {
    const qs=[...VF_QUESTIONS];
    for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
    jx.vf={questions:qs,idx:0,score:0,answered:false};
  }
  render();
}

function renderFrise(app){
  const{items,checked,score}=jx.frise;
  const correctDates=[...FRISE_EVENTS].map(e=>e.date);
  let html=mainNav()+hgSubNav()+`
  <div class="jx-top">
    <button class="fc-back-sm" onclick="jx.mode=null;render()">← Jeux</button>
    <div class="jx-title">📅 Frise chronologique</div>
  </div>
  <div class="jx-frise-hint">Glisse les événements pour les mettre dans l\u2019ordre chronologique</div>
  <div class="jx-frise-list" id="frise-list">`;
  items.forEach((item,i)=>{
    let cls='jx-frise-item';
    if(checked){
      const correctIdx=correctDates.indexOf(item.date);
      cls+=correctIdx===i?' jx-correct':' jx-wrong';
    }
    html+=`<div class="${cls}" draggable="true"
      ondragstart="friseDS(${i})"
      ondragover="event.preventDefault()"
      ondrop="friseDP(${i})"
      ontouchstart="friseTStart(${i},event)"
      ontouchmove="friseTMove(event)"
      ontouchend="friseTEnd(${i})">
      <div class="jx-frise-handle">⠿</div>
      <div class="jx-frise-content">
        ${checked?`<div class="jx-frise-date">${item.date}</div>`:''}
        <div class="jx-frise-text">${item.text}</div>
        ${checked&&correctDates.indexOf(item.date)!==i?`<div class="jx-frise-corr">→ Position correcte : ${correctDates.indexOf(item.date)+1} (${item.date})</div>`:''}
      </div>
      <div class="jx-frise-num">${i+1}</div>
    </div>`;
  });
  html+=`</div>`;
  if(!checked){
    html+=`<button class="jx-check-btn" onclick="checkFrise()">✅ Vérifier mon ordre</button>`;
  } else {
    const total=items.length;
    html+=`<div class="jx-result-box">
      <div class="jx-result-score">${score} / ${total} correct${score>1?'s':''}</div>
      <div class="jx-result-pct">${Math.round(score/total*100)} % de réussite</div>
      <div class="jx-result-bar"><div class="jx-result-fill" style="width:${Math.round(score/total*100)}%"></div></div>
      <button class="jx-retry-btn" onclick="startJeu('frise')">🔄 Recommencer</button>
    </div>`;
  }
  app.innerHTML=html;
}

function friseDS(i){jx.frise.dragging=i;}
function friseDP(i){
  const items=jx.frise.items;
  const drag=jx.frise.dragging;
  if(drag===null||drag===i)return;
  const tmp=items.splice(drag,1)[0];
  items.splice(i,0,tmp);
  jx.frise.dragging=null;
  render();
}
// Touch support for mobile
let _touchDrag=null,_touchTarget=null;
function friseTStart(i,e){_touchDrag=i;_touchTarget=e.target;}
function friseTMove(e){e.preventDefault();}
function friseTEnd(i){
  if(_touchDrag!==null&&_touchDrag!==i){
    const items=jx.frise.items;
    const tmp=items.splice(_touchDrag,1)[0];
    items.splice(i,0,tmp);
    render();
  }
  _touchDrag=null;
}
function checkFrise(){
  const correctDates=[...FRISE_EVENTS].map(e=>e.date);
  let score=0;
  jx.frise.items.forEach((item,i)=>{if(item.date===correctDates[i])score++;});
  jx.frise.checked=true;
  jx.frise.score=score;
  render();
}

function renderVF(app){
  const{questions,idx,score,answered}=jx.vf;
  if(idx>=questions.length){
    const total=questions.length;
    app.innerHTML=mainNav()+hgSubNav()+`

      <div class="jx-vf-trophy">${score>=total*0.8?'🏆':score>=total*0.5?'👍':'💪'}</div>

      <div class="jx-result-pct">${Math.round(score/total*100)}% de réussite</div>
      <div class="jx-result-bar"><div class="jx-result-fill" style="width:${Math.round(score/total*100)}%"></div></div>
      <button class="jx-retry-btn" onclick="startJeu('vf')">🔄 Rejouer</button>
      <button class="jx-retry-btn jx-back-btn" onclick="jx.mode=null;render()">← Choisir un jeu</button>
    </div>`;
    return;
  }
  const q=questions[idx];
  const pct=Math.round((idx/questions.length)*100);
  app.innerHTML=mainNav()+hgSubNav()+`
  <div class="jx-top">
    <button class="fc-back-sm" onclick="jx.mode=null;render()">← Jeux</button>
    <div class="fc-progress-bar"><div class="fc-progress-fill" style="width:${pct}%"></div></div>
    <div class="fc-counter">${idx+1}/${questions.length}</div>
  </div>
  <div class="jx-vf-score-row"><span class="fc-stat fc-known">✅ ${score}</span><span class="fc-stat fc-review">❌ ${idx-score}</span></div>
  <div class="jx-vf-card">
    <div class="jx-vf-badge">Vrai ou Faux ?</div>
    <div class="jx-vf-question">${q.q}</div>
    ${answered?`
    <div class="jx-vf-exp ${q.r?'jx-vf-true':'jx-vf-false'}">
      <div class="jx-vf-verdict">${q.r?'✅ VRAI':'❌ FAUX'}</div>
      <div class="jx-vf-exptext">${q.exp}</div>
    </div>
    <button class="jx-vf-next" onclick="vfNext()">Suite →</button>
    `:`
    <div class="jx-vf-btns">
      <button class="jx-vf-btn jx-vf-true-btn" onclick="answerVF(true)">✅ Vrai</button>
      <button class="jx-vf-btn jx-vf-false-btn" onclick="answerVF(false)">❌ Faux</button>
    </div>`}
  </div>`;
}

function answerVF(answer){
  jx.vf.answered=true;
  if(answer===jx.vf.questions[jx.vf.idx].r) jx.vf.score++;
  render();
}
function vfNext(){jx.vf.idx++;jx.vf.answered=false;render();}

let ea = {active:false, idx:0, plan:'', shown:false, sent:false};

function renderEntrainement(app){
  let html = mainNav() + `<div class="fr-header">

  if(!ea.active){
    html+=`<div class="ea-pick-section">

      <div class="ea-probl-list">
        ${CORRIGES.map((c,i)=>`
          <button class="ea-probl-btn" onclick="pickProbl(${i})">

        <div class="ea-question-text">${corr.p}</div>
        <button class="ea-change-btn" onclick="ea.active=false;ea.shown=false;ea.plan='';renderEntrainement(document.getElementById('app'))">← Changer de sujet</button>

          <div class="ea-instr-item">• <strong>Partie 1</strong> : argument + exemple tiré du corpus ou de <em>Courir</em></div>

// ─── RETOUR AUTOMATIQUE SUR LE PLAN (sans IA) ───────────────────
function eaEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function eaNorm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,' ');}

const EA_OEUVRES = [
  {nom:'Echenoz — Courir', k:['echenoz','courir','zatopek'], integrale:true},
  {nom:'Ponthus — À la ligne', k:['ponthus','a la ligne']},
  {nom:'Patino — La Civilisation du poisson rouge', k:['patino','poisson rouge']},
  {nom:'Martin — la déconnexion', k:['melusine','martin','deconnexion','digital detox']},
  {nom:'Murakami', k:['murakami']},
  {nom:'Chaplin — Les Temps modernes', k:['chaplin','charlot','temps modernes']},
  {nom:'Vallès — L’Enfant', k:['valles','vingtras','robinson']},
  {nom:'Barjavel — Le Voyageur imprudent', k:['barjavel','voyageur imprudent','grand-pere','grand pere']},
  {nom:'Siffre', k:['siffre']},
  {nom:'Bloch — le temps collectif', k:['bloch']},
  {nom:'Andrea — Veiller sur elle', k:['andrea','veiller sur elle','viola']},
  {nom:'Einstein', k:['einstein']},
  {nom:'Van Gogh', k:['van gogh','gachet']},
];
const EA_CONNECTEURS = ["d’abord","tout d’abord","ensuite","puis","enfin","de plus","en outre","par ailleurs","cependant","toutefois","pourtant","néanmoins","en revanche","mais","au contraire","en effet","car","parce que","puisque","ainsi","donc","c’est pourquoi","par conséquent","en conclusion","pour conclure","par exemple","notamment","d’une part","d’autre part","premièrement","deuxièmement","dans un premier temps","dans un second temps","même si","alors que","tandis que"];
// [mot affiché, racine cherchée]
const EA_NOTIONS = [["temps subi","temps subi"],["temps approprié","temps appropri"],["temps pour soi","temps pour soi"],["aliénation","alien"],["cadence","cadence"],["rythme","rythme"],["performance","performance"],["liberté","liberte"],["accélération","accelera"],["immédiateté","immediatete"],["attention","attention"],["addiction","addiction"],["productivité","productivite"],["déshumanisation","deshumanis"],["irréversibilité","irreversib"],["déconnexion","deconnexion"],["lenteur","lenteur"]];

function eaHas(t,k){return new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)').test(t);}

function analyzePlan(text, corr){
  const t=eaNorm(text);
  const words=(text.trim().match(/\S+/g)||[]).length;
  const oeuvres=EA_OEUVRES.filter(o=>o.k.some(k=>eaHas(t,k)));
  const courir=oeuvres.some(o=>o.integrale);
  const conn=EA_CONNECTEURS.filter(c=>eaHas(t,eaNorm(c)));
  const notions=EA_NOTIONS.filter(([,r])=>t.includes(r)).map(([d])=>d);
  const intro=/(introduction|accroche|nous verrons|on verra|je vais montrer|dans un premier temps|tout d abord|problematique)/.test(t);
  const p1=/(partie 1|partie i\b|^\s*i[.)-]|\n\s*i[.)-]|1[.)]\s|premierement|d une part|dans un premier temps|tout d abord|d abord)/.test(t);
  const p2=/(partie 2|partie ii\b|\n\s*ii[.)-]|2[.)]\s|deuxiemement|d autre part|dans un second temps|ensuite|cependant|toutefois|en revanche)/.test(t);
  const ccl=/(conclusion|pour conclure|en conclusion|finalement|pour finir|en definitive)/.test(t);
  const answers=/(selon moi|a mon avis|je pense|oui|non|ainsi|donc)/.test(t);
  const corrNorm=eaNorm(JSON.stringify(corr));
  const suggest=EA_OEUVRES.filter(o=>!oeuvres.includes(o)&&o.k.some(k=>corrNorm.includes(k))).map(o=>o.nom).slice(0,3);

  const checks=[
    {ok:words>=120, mid:words>=60, label:`Longueur : ${words} mots`, tip:words>=120?'Ton plan est bien développé.':words>=60?'C’est un peu court : développe tes arguments et tes exemples (vise au moins 120 mots).':'Beaucoup trop court : un plan doit contenir une intro, deux parties avec exemples et une conclusion.'},
    {ok:intro, label:'Introduction', tip:intro?'Tu annonces bien ton introduction ou ton plan.':'Je ne trouve pas d’introduction : commence par une accroche et annonce ton plan (« Nous verrons d’abord… puis… »).'},
    {ok:p1&&p2, mid:p1||p2, label:'Deux parties', tip:p1&&p2?'On repère bien deux parties.':'Je ne repère pas clairement deux parties : utilise « Partie 1 / Partie 2 » ou « D’une part… d’autre part… ».'},
    {ok:ccl, label:'Conclusion', tip:ccl?'Tu as une conclusion.':'Pas de conclusion repérée : termine en répondant clairement à la question posée.'},
    {ok:oeuvres.length>=2, mid:oeuvres.length===1, label:`Œuvres citées : ${oeuvres.length}`, tip:oeuvres.length?`Tu cites : ${oeuvres.map(o=>o.nom).join(', ')}.${oeuvres.length<2?' Il en faut au moins deux.':''}`:'Aucune œuvre du corpus repérée : appuie chaque partie sur un texte étudié.'},
    {ok:courir, label:'Courir (œuvre intégrale)', tip:courir?'Tu utilises l’œuvre intégrale, très bien.':'Pense à utiliser Courir d’Echenoz (Zátopek) : c’est l’œuvre intégrale du programme.'},
    {ok:conn.length>=4, mid:conn.length>=2, label:`Connecteurs logiques : ${conn.length}`, tip:conn.length?`Repérés : ${conn.slice(0,8).join(', ')}.${conn.length<4?' Ajoutes-en pour relier tes idées (cependant, en effet, ainsi…).':''}`:'Aucun connecteur repéré : utilise d’abord, ensuite, cependant, en effet, ainsi…'},
    {ok:notions.length>=3, mid:notions.length>=1, label:`Vocabulaire du thème : ${notions.length}`, tip:notions.length?`Repéré : ${notions.join(', ')}.`:'Utilise le vocabulaire du thème : temps subi, temps pour soi, cadence, aliénation, performance…'},
  ];
  const score=checks.reduce((a,c)=>a+(c.ok?1:c.mid?0.5:0),0);
  return {checks,score,total:checks.length,suggest,words};
}

function renderAutoFeedback(text, corr){
  if(!text||!text.trim()) return `<div class="ea-auto"><div class="ea-auto-title">🤖 Retour automatique</div><div class="ea-auto-empty">Tu n’as rien écrit. Écris ton plan avant de regarder le corrigé, c’est comme ça qu’on progresse !</div></div>`;
  const a=analyzePlan(text,corr);
  const pct=Math.round(a.score/a.total*100);
  const verdict=pct>=80?'🟢 Très bon plan, compare-le maintenant au corrigé.':pct>=50?'🟡 Bonne base : regarde les points orange et rouges ci-dessous.':'🔴 Ton plan doit être retravaillé : suis les conseils ci-dessous.';
  return `<div class="ea-auto">
    <div class="ea-auto-head"><div class="ea-auto-title">🤖 Retour automatique</div><div class="ea-auto-score">${a.score.toString().replace('.',',')} / ${a.total}</div></div>
    <div class="ea-auto-bar"><div class="ea-auto-fill" style="width:${pct}%"></div></div>
    <div class="ea-auto-verdict">${verdict}</div>

function eaMailOn(){return CONFIG.formspree&&CONFIG.formspree!=='VOTRE_CODE_FORMSPREE';}
function renderSendBox(){
  if(!eaMailOn())return '';
  if(ea.sent)return `<div class="ea-send ea-send-done">📨 Ton plan a bien été envoyé à ton prof. Bravo !</div>`;
  return `<div class="ea-send">
    <div class="ea-send-title">📨 Envoyer mon plan à mon prof</div>
    <div class="ea-send-row">
      <input class="modal-input" id="ea-name" placeholder="Prénom et nom" maxlength="40" value="${eaEsc(state.studentName||'')}">
      <input class="modal-input" id="ea-class" placeholder="Classe" maxlength="30" value="${eaEsc(state.studentClass||'')}">
    </div>
    <button class="ea-send-btn" id="ea-send-btn" onclick="sendPlan()">Envoyer</button>
    <div class="ea-send-msg" id="ea-send-msg"></div>
  </div>`;
}
async function sendPlan(){
  const name=document.getElementById('ea-name').value.trim();
  const cls=document.getElementById('ea-class').value.trim();
  const msg=document.getElementById('ea-send-msg');
  const btn=document.getElementById('ea-send-btn');
  if(!name){msg.textContent='Écris ton prénom et ton nom.';return;}
  if(!ea.plan.trim()){msg.textContent='Ton plan est vide.';return;}
  const corr=CORRIGES[ea.idx];const a=analyzePlan(ea.plan,corr);
  btn.disabled=true;btn.textContent='Envoi en cours…';msg.textContent='';
  try{
    const r=await fetch('https://formspree.io/f/'+CONFIG.formspree,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({_subject:`Plan de ${name} (${cls||'classe ?'}) — ${corr.p}`,eleve:name,classe:cls,sujet:corr.p,plan:ea.plan,retour_automatique:`${a.score}/${a.total} — `+a.checks.map(c=>(c.ok?'OK':c.mid?'~':'X')+' '+c.label).join(' | ')})});
    if(!r.ok)throw new Error(r.status);
    ea.sent=true;state.studentName=state.studentName||name;state.studentClass=state.studentClass||cls;save();
    renderEntrainement(document.getElementById('app'));
  }catch(e){btn.disabled=false;btn.textContent='Envoyer';msg.textContent='L’envoi n’a pas marché. Vérifie ta connexion et réessaie.';}
}

function pickProbl(i){
  ea.active=true;ea.sent=false;
  ea.plan='';
  ea.shown=false;
  ea.idx=i===-1?Math.floor(Math.random()*CORRIGES.length):i;
  renderEntrainement(document.getElementById('app'));
}

function renderQuiz(app){
  const ti=state.themeIdx;const th=THEMES[ti];const qi=state.qIdx;const q=th.q[qi];
  const sh=state.shuffles[ti][qi]; // sh[displayPos] = original index
  const answered=state.answers[ti][qi]!==null;const pct=Math.round(((qi+1)/th.q.length)*100);
  const{s:ts}=themeScore(ti);const done=themeDone(ti);
  app.innerHTML=`<div class="quiz-top"><button class="btn-back" onclick="goHome()">← Thèmes</button><div><div class="quiz-title">${th.icon} ${th.label}</div><div class="quiz-sub">${th.sub}</div></div><div class="quiz-score-pill">${ts} / ${done}</div></div>
  <div class="q-progress"><div class="q-progress-fill" style="width:${pct}%;background:${th.color}"></div></div>
  <div class="q-card">
    <div class="q-meta"><span class="q-num">Q ${qi+1} / ${th.q.length}</span><span class="q-tag tag-${q.t}">${q.t==='N'?'Notion':'Date'}</span></div>
    <div class="q-text">${q.q}</div>
    <div class="q-options" id="opts"></div>
    <div id="fb"></div>
  </div>
  <div class="q-nav" id="qnav"></div>`;
  const opts=document.getElementById('opts');
  // Display options in shuffled order; answers stored as original indices
  sh.forEach((origIdx,displayPos)=>{
    const btn=document.createElement('button');btn.className='opt-btn';
    if(answered){
      btn.disabled=true;
      if(origIdx===q.c)btn.classList.add(state.answers[ti][qi]===origIdx?'correct':'reveal');
      else if(state.answers[ti][qi]===origIdx)btn.classList.add('wrong');
    }
    btn.innerHTML=`<span class="opt-letter">${L[displayPos]}</span>${q.o[origIdx]}`;
    if(!answered)btn.onclick=()=>doAnswer(ti,qi,origIdx); // store original index
    opts.appendChild(btn);
  });
  if(answered){
    const ok=state.answers[ti][qi]===q.c;
    document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'ok':'ko'}"><span style="margin-right:4px">${ok?'✓':'✗'}</span>${ok?'Bonne réponse ! ':' Pas tout à fait. '}${q.e}</div>`;
    const isLast=qi===th.q.length-1;
    document.getElementById('qnav').innerHTML=`<button class="btn-next primary" style="--c:${th.color}" onclick="nextQ()">${isLast?'Voir les résultats →':'Question suivante →'}</button>`;
  }
}

function doAnswer(ti,qi,origIdx){state.answers[ti][qi]=origIdx;save();render();}

function nextQ(){
  const th=THEMES[state.themeIdx];
  if(state.qIdx===th.q.length-1){
    state.screen='result';state.showReview=false;
    submitScore(state.themeIdx);
  }else{state.qIdx++;}
  render();
}
function goHome(){state.screen='home';state.tab='hg';render();}

// ─── RESULT ──────────────────────────────────────────────────────
function renderResult(app){
  const ti=state.themeIdx;const th=THEMES[ti];
  const{s,t}=themeScore(ti);const pct=Math.round((s/th.q.length)*100);
  const msg=pct>=80?'Excellent ! Tu maîtrises très bien ce thème.':pct>=60?'Bon travail ! Quelques points méritent d\'être revus.':'Continue les révisions ! Relis le cours et les explications.';
  const C=251.3;const dash=C-(C*pct/100);
  const hasErr=th.q.some((_,qi)=>state.answers[ti][qi]!==null&&state.answers[ti][qi]!==th.q[qi].c);
  const ca=state.classAverages[ti>-1?th.id:null];

  let compareHtml='';
  if(FIREBASE_ON&&ca&&ca.count>=2){
    const diff=pct-ca.avg;
    const verdict=diff>5?`🟢 Tu es <strong style="color:#3ecf8e">${diff} points au-dessus</strong> de la moyenne de la classe.`:diff<-5?`🔴 Tu es <strong style="color:var(--red)">${Math.abs(diff)} points en-dessous</strong> de la moyenne de la classe.`:`🟡 Tu es <strong style="color:#facc15">dans la moyenne</strong> de la classe.`;
    compareHtml=`<div class="compare-box">
      <div class="compare-row"><span class="compare-label">Ma note</span><span class="compare-val" style="color:${th.color}">${pct}%</span></div>
      <div class="compare-row"><span class="compare-label">Moyenne classe (${ca.count} élèves)</span><span class="compare-val" style="color:var(--text2)">${ca.avg}%</span></div>
      <div class="compare-bar-wrap" style="height:6px;margin-top:8px">
        <div class="compare-bar-class" style="width:${ca.avg}%"></div>
        <div class="compare-bar-me" style="width:${pct}%;background:${th.color}"></div>
      </div>
      <div class="compare-legend">
        <span><span class="compare-dot" style="background:${th.color}"></span>Ma note</span>
        <span><span class="compare-dot" style="background:var(--text3)"></span>Moyenne classe</span>
      </div>
      <div class="compare-verdict">${verdict}</div>
    </div>`;
  }

  app.innerHTML=`<div class="result-back"><button class="btn-back" onclick="goHome()">← Tous les thèmes</button><div><div class="result-header">${th.icon} ${th.label}</div><div class="result-sub">${th.sub}</div></div></div>
  <div class="result-card">
    <div class="result-ring">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="40"/>
        <circle class="ring-fill" cx="50" cy="50" r="40" stroke="${th.color}" stroke-dasharray="${C}" stroke-dashoffset="${dash}" id="ring"/>
      </svg>
      <div class="result-ring-text"><div class="ring-score" style="color:${th.color}">${s}</div><div class="ring-total">/ ${th.q.length}</div></div>
    </div>
    <div class="result-pct">${pct}% de bonnes réponses</div>
    <div class="result-msg">${msg}</div>
    ${compareHtml}
    <div class="result-btns">
      <button class="btn-action accent" style="--c:${th.color}" onclick="retryTheme()">↺ Recommencer</button>
      <button class="btn-action" onclick="goHome()">← Retour</button>
      ${hasErr?`<button class="btn-action" onclick="toggleReview()">Mes erreurs ↓</button>`:''}
    </div>
  </div>
  <div id="revarea"></div>`;

  if(state.showReview)renderReview();
}

function toggleReview(){state.showReview=!state.showReview;if(state.showReview)renderReview();else{const a=document.getElementById('revarea');if(a)a.innerHTML='';}}
function renderReview(){
  const ti=state.themeIdx;const th=THEMES[ti];const area=document.getElementById('revarea');if(!area)return;
  let html='';
  th.q.forEach((q,qi)=>{const a=state.answers[ti][qi];if(a===null||a===q.c)return;html+=`<div class="review-item"><div class="ri-meta"><span class="q-tag tag-${q.t}">${q.t==='N'?'Notion':'Date'}</span><span class="q-num">Q.${qi+1}</span></div><div class="ri-q">${q.q}</div><div class="ri-ans"><span class="wrong-ans">✗ Ta réponse : ${q.o[a]}</span><br><span class="right-ans">✓ Bonne réponse : ${q.o[q.c]}</span><br><span class="expl">${q.e}</span></div></div>`;});
  if(!html)html='<div style="text-align:center;padding:24px;color:var(--text2);font-size:13px">🎉 Aucune erreur !</div>';
  area.innerHTML=html;
}
function retryTheme(){const ti=state.themeIdx;state.answers[ti]=new Array(THEMES[ti].q.length).fill(null);reshuffleTheme(ti);state.qIdx=0;state.screen='quiz';state.showReview=false;save();render();}

// ─── THEME ───────────────────────────────────────────────────────
const SUN='☀️'; const MOON='🌙';
function applyTheme(light){
  document.documentElement.classList.toggle('light',light);
  const btn=document.getElementById('theme-toggle');
  if(btn)btn.textContent=light?MOON:SUN;
}
function toggleTheme(){
  const isLight=document.documentElement.classList.contains('light');
  const next=!isLight;
  applyTheme(next);
  try{localStorage.setItem('qcm_theme',next?'light':'dark');}catch(e){}
}
function loadTheme(){
  try{
    const saved=localStorage.getItem('qcm_theme');
    if(saved)return applyTheme(saved==='light');
  }catch(e){}
  // Respect préférence système si pas de préférence sauvegardée
  const preferLight=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(preferLight);
}

// ─── INIT ────────────────────────────────────────────────────────
load();
loadTheme();
if(!state.shuffles)state.shuffles=generateShuffles();
state.screen='landing'; // toujours démarrer sur la page de garde
initFirebase();
if(checkDashboard()){
  document.getElementById('app').innerHTML='';
  if(FIREBASE_ON)renderDashboard(document.getElementById('app'));
  else{document.getElementById('app').innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--text2)"><p style="font-size:24px;margin-bottom:12px">🔧</p><p>Firebase non configuré.</p></div>`;}
}else{
  render();
}
</script>
</body>
</html>
