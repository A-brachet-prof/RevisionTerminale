<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QCM — Histoire-Géographie Tle Bac Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
:root {
  --bg:#080c18;--surface:#0f1525;--surface2:#18213a;--surface3:#1f2d4a;
  --border:#263354;--text:#e4eaf8;--text2:#7a8aaa;--text3:#45567a;
  --green:#3ecf8e;--green-bg:rgba(62,207,142,.12);--green-border:rgba(62,207,142,.35);
  --red:#f26b6b;--red-bg:rgba(242,107,107,.1);--red-border:rgba(242,107,107,.35);
  --r:14px;--rs:8px;
  --modal-overlay:rgba(8,12,24,.97);
  --grain-opacity:.5;
}
html.light {
  --bg:#f0f3fb;--surface:#ffffff;--surface2:#eaeff8;--surface3:#dde4f2;
  --border:#c8d3ea;--text:#111827;--text2:#4a5a7a;--text3:#8898b8;
  --green:#0f9e65;--green-bg:rgba(15,158,101,.1);--green-border:rgba(15,158,101,.35);
  --red:#d63b3b;--red-bg:rgba(214,59,59,.08);--red-border:rgba(214,59,59,.3);
  --modal-overlay:rgba(220,228,245,.97);
  --grain-opacity:.18;
}
/* Adaptations spécifiques light */
html.light .opt-btn{color:var(--text2)}
html.light .opt-btn:hover:not(:disabled){color:var(--text)}
html.light .opt-btn.correct{color:#0a5c3a}
html.light .opt-btn.reveal{color:#0a5c3a}
html.light .opt-btn.wrong{color:#7a1818}
html.light .feedback.ok{color:#0a5c3a}
html.light .feedback.ko{color:#7a1818}
html.light .ri-ans .wrong-ans{color:#c0392b}
html.light .ri-ans .right-ans{color:#0f9e65}
html.light .ri-ans .expl{color:var(--text3)}
html.light .bar-fill{background:linear-gradient(90deg,#0f9e65,#3b82f6)}
html.light .pct-high{background:rgba(15,158,101,.12);color:#0f7a50}
html.light .pct-mid{background:rgba(202,138,4,.1);color:#927000}
html.light .pct-low{background:rgba(214,59,59,.1);color:#c0392b}
html.light .modal-overlay{background:var(--modal-overlay)}
html.light body::before{opacity:var(--grain-opacity)}

/* ─── FLASHCARDS ───────────────────────────────────────────── */
.fr-flash-launch{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 18px;border-radius:99px;border:1px solid #a78bfa44;background:#a78bfa14;color:#a78bfa;font-family:'Sora',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
.fr-flash-launch:hover{background:#a78bfa22;transform:translateY(-1px)}
.fc-wrap{padding:0 0 40px;animation:fadeUp .35s ease both;max-width:520px;margin:0 auto}
.fc-back{background:none;border:none;color:var(--text2);font-family:'Sora',sans-serif;font-size:13px;cursor:pointer;padding:8px 0;margin-bottom:16px;display:flex;align-items:center;gap:4px}
.fc-back:hover{color:var(--text)}
.fc-pick-title{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--text);margin-bottom:6px}
.fc-pick-sub{font-size:13px;color:var(--text2);margin-bottom:22px}
.fc-deck-list{display:flex;flex-direction:column;gap:10px}
.fc-deck-btn{display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--dc,var(--border));border-radius:var(--r);cursor:pointer;font-family:'Sora',sans-serif;text-align:left;transition:border-color .15s,transform .1s,background .15s}
.fc-deck-btn:hover{transform:translateX(3px);background:var(--surface2)}
.fc-deck-icon{font-size:24px;line-height:1;flex-shrink:0}
.fc-deck-info{flex:1}
.fc-deck-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.fc-deck-count{font-size:12px;color:var(--text2)}
.fc-deck-arrow{font-size:16px;color:var(--text3);transition:transform .2s}
.fc-deck-btn:hover .fc-deck-arrow{transform:translateX(4px)}
.fc-topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fc-back-sm{background:none;border:none;color:var(--text2);font-family:'Sora',sans-serif;font-size:12px;cursor:pointer;padding:4px 0;white-space:nowrap}
.fc-progress-bar{flex:1;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.fc-progress-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#60a5fa);border-radius:99px;transition:width .4s}
.fc-counter{font-size:12px;color:var(--text2);font-weight:600;white-space:nowrap}
.fc-stats-row{display:flex;justify-content:center;gap:16px;margin-bottom:16px}
.fc-stat{font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--border)}
.fc-known{color:#34d399}
.fc-review{color:#f472b6}
/* 3D flip card */
.fc-scene{perspective:1200px;cursor:pointer;margin-bottom:18px}
.fc-card{position:relative;width:100%;min-height:220px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.fc-card.fc-flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--border)}
.fc-front{background:var(--surface);border-top:4px solid #a78bfa}
.fc-back{background:var(--surface);border-top:4px solid #34d399;transform:rotateY(180deg)}
.fc-face-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:14px}
.fc-question{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--text);line-height:1.4}
.fc-answer{font-family:'Sora',sans-serif;font-size:13px;font-weight:400;color:var(--text2);line-height:1.65}
.fc-tap-hint{margin-top:16px;font-size:11px;color:var(--text3);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-btn{padding:13px;border-radius:var(--r);border:1px solid var(--border);font-family:'Sora',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:transform .1s,background .15s}
.fc-btn:active{transform:scale(.96)}
.fc-btn-review{background:var(--surface2);color:#f472b6;border-color:#f472b644}
.fc-btn-review:hover{background:#f472b614}
.fc-btn-known{background:var(--surface2);color:#34d399;border-color:#34d39944}
.fc-btn-known:hover{background:#34d39914}
.fc-actions-hint{text-align:center;font-size:12px;color:var(--text3);padding:10px 0}
/* Results */
.fc-result-title{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--text);text-align:center;margin:20px 0 24px}
.fc-result-score{text-align:center;margin-bottom:12px}
.fc-result-num{font-family:'Fraunces',serif;font-size:42px;font-weight:600}
.fc-result-lbl{font-size:13px;color:var(--text2)}
.fc-result-bar{width:100%;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:20px 0 8px;border:1px solid var(--border)}
.fc-result-fill{height:100%;background:linear-gradient(90deg,#34d399,#a78bfa);border-radius:99px}
.fc-result-pct{text-align:center;font-size:14px;font-weight:600;color:var(--text);margin-bottom:24px}
.fc-result-btns{display:flex;flex-direction:column;gap:10px}
.fc-rbtn{padding:12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);font-family:'Sora',sans-serif;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:background .15s}
.fc-rbtn:hover{background:var(--surface3)}
.fc-rbtn:disabled{opacity:.4;cursor:not-allowed}
.fc-rbtn-retry{border-color:#a78bfa44;color:#a78bfa}
.fc-rbtn-review{border-color:#f472b644;color:#f472b6}

/* ─── FRANÇAIS ─────────────────────────────────────────────── */
.fr-header{margin-bottom:18px;animation:fadeUp .4s ease both}
.fr-header-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--text);margin-bottom:4px}
.fr-header-sub{font-size:12px;color:var(--text2);line-height:1.5}
.fr-sections{display:flex;flex-direction:column;gap:10px;animation:fadeUp .4s .05s ease both}
.fr-section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s}
.fr-section-card.fr-open{border-color:var(--sc,var(--border))}
.fr-section-header{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;background:none;border:none;cursor:pointer;text-align:left;font-family:'Sora',sans-serif;transition:background .15s}
.fr-section-header:hover{background:var(--surface2)}
.fr-section-icon{font-size:18px;line-height:1}
.fr-section-label{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.fr-section-arrow{font-size:11px;color:var(--text3);transition:transform .2s;display:inline-block}
.fr-section-body{padding:4px 16px 18px;border-top:1px solid var(--border)}
.fr-notion-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px}
@media(max-width:480px){.fr-notion-grid{grid-template-columns:1fr}}
.fr-notion-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px}
.fr-notion-term{font-size:12px;font-weight:700;color:#a78bfa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.fr-notion-def{font-size:12px;color:var(--text2);line-height:1.6}
.fr-oeuvre-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:12px 0 6px}
.fr-oeuvre-card{background:var(--surface2);border-left:3px solid var(--oc,var(--border));border-radius:0 var(--rs) var(--rs) 0;padding:12px 14px;margin-bottom:10px}
.fr-oeuvre-author{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.fr-oeuvre-title{font-size:14px;font-weight:600;color:var(--text);margin:2px 0}
.fr-oeuvre-ref{font-size:11px;color:var(--oc,var(--text3))}
.fr-oeuvre-desc{font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:8px}
.fr-oeuvre-angles{display:flex;flex-direction:column;gap:4px}
.fr-angle{font-size:12px;color:var(--text2);line-height:1.5;padding-left:4px}
.fr-other-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
@media(max-width:480px){.fr-other-grid{grid-template-columns:1fr}}
.fr-other-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px}
.fr-other-head{font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px}
.fr-other-body{font-size:12px;color:var(--text2);line-height:1.6}
.fr-q-block{padding-top:12px}
.fr-q-title{font-family:'Fraunces',serif;font-size:15px;color:var(--text);margin-bottom:10px;line-height:1.45}
.fr-approach-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
@media(max-width:520px){.fr-approach-grid{grid-template-columns:1fr}}
.fr-approach-card{background:var(--surface2);border-top:3px solid var(--ac,var(--border));border-radius:0 0 var(--rs) var(--rs);padding:10px 12px}
.fr-approach-label{font-size:11px;font-weight:700;color:var(--ac,var(--text2));text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.fr-approach-text{font-size:12px;color:var(--text2);line-height:1.6}
.fr-meth-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:12px}
@media(max-width:480px){.fr-meth-grid{grid-template-columns:1fr}}
.fr-meth-card{background:var(--surface2);border-top:3px solid var(--mc,var(--border));border-radius:0 0 var(--rs) var(--rs);padding:14px}
.fr-meth-head{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.fr-meth-pts{font-size:11px;color:var(--mc,var(--text2));font-weight:700;background:var(--surface3);padding:2px 8px;border-radius:99px}
.fr-meth-list{padding-left:16px;display:flex;flex-direction:column;gap:6px}
.fr-meth-list li{font-size:12.5px;color:var(--text2);line-height:1.6}
.fr-conseil{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-top:14px}
.fr-conseil-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px}
.fr-conseil-grid{display:flex;flex-direction:column;gap:8px}
.fr-conseil-item{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--text2);line-height:1.5}
.fr-conseil-num{width:22px;height:22px;min-width:22px;border-radius:50%;background:var(--surface3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fb923c}
.fr-proc-list{display:flex;flex-direction:column;gap:0;padding-top:8px}
.fr-proc-item{padding:11px 0;border-bottom:1px solid var(--border)}
.fr-proc-item:last-child{border-bottom:none}
.fr-proc-name{font-size:13px;font-weight:700;color:#60a5fa;margin-bottom:3px}
.fr-proc-def{font-size:12.5px;color:var(--text);margin-bottom:2px}
.fr-proc-ex{font-size:12px;color:var(--text2);font-style:italic}
.fr-vocab-block{padding-top:12px}
.fr-vocab-cat{font-size:13px;font-weight:700;margin-bottom:8px}
.fr-vocab-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.fr-vocab-tag{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid;font-weight:500}

/* TOGGLE BOUTON */
.theme-toggle{
  position:fixed;bottom:22px;right:18px;z-index:100;
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text2);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.25);
  transition:background .2s,border-color .2s,transform .15s,box-shadow .2s;
}
.theme-toggle:hover{background:var(--surface3);border-color:var(--text3);transform:scale(1.08);box-shadow:0 4px 16px rgba(0,0,0,.3);}
html.light .theme-toggle{box-shadow:0 2px 12px rgba(0,0,0,.12)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:var(--grain-opacity,.5)}
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:20px 16px 60px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(8,12,24,.97);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;max-width:360px;width:100%;animation:fadeUp .3s ease}
.modal-emoji{font-size:32px;margin-bottom:12px}
.modal-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--text);margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.modal-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px;display:block}
.modal-input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Sora',sans-serif;font-size:14px;margin-bottom:12px;outline:none;transition:border-color .15s;-webkit-appearance:none}
.modal-input:focus{border-color:var(--text2)}
.modal-input::placeholder{color:var(--text3)}
.modal-btn{width:100%;padding:11px;border-radius:var(--rs);border:none;background:#3ecf8e;color:#052513;font-family:'Sora',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:filter .15s;margin-top:4px}
.modal-btn:hover{filter:brightness(1.1)}

/* HEADER */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;animation:fadeUp .4s ease both}
.page-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--text);line-height:1.3}
.page-sub{font-size:12px;color:var(--text2);margin-top:3px;letter-spacing:.02em}
.score-badge{flex-shrink:0;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}

/* STUDENT ID STRIP */
.student-strip{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;margin-bottom:14px;font-size:12px;color:var(--text2);animation:fadeUp .35s ease both}
.student-name{font-weight:600;color:var(--text)}
.btn-change{background:none;border:none;color:var(--text3);font-family:'Sora',sans-serif;font-size:11px;cursor:pointer;padding:2px 6px;border-radius:4px;transition:color .15s}
.btn-change:hover{color:var(--text2)}

/* GLOBAL BAR */
.global-bar{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;animation:fadeUp .4s .05s ease both}
.global-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.global-pct{font-size:22px;font-weight:700}
.global-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em}
.global-answered{font-size:12px;color:var(--text2)}
.bar-track{height:5px;background:var(--surface3);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#3ecf8e,#60a5fa);transition:width .5s cubic-bezier(.4,0,.2,1)}

/* THEME GRID */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.theme-grid{grid-template-columns:1fr}}
.theme-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:transform .15s,border-color .2s,background .15s;position:relative;overflow:hidden;animation:fadeUp .4s ease both}
.theme-card:nth-child(1){animation-delay:.08s}.theme-card:nth-child(2){animation-delay:.12s}
.theme-card:nth-child(3){animation-delay:.16s}.theme-card:nth-child(4){animation-delay:.20s}
.theme-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,#fff);border-radius:var(--r) var(--r) 0 0}
.theme-card:active{transform:scale(.98)}
.theme-card.done{border-color:var(--c,var(--border))}
.tc-icon{width:38px;height:38px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px;background:var(--c-bg,var(--surface2))}
.tc-label{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:2px}
.tc-sub{font-size:11px;color:var(--text2);line-height:1.4;margin-bottom:10px}
.tc-bar{height:3px;background:var(--surface3);border-radius:99px;overflow:hidden;margin-bottom:5px}
.tc-fill{height:100%;border-radius:99px;background:var(--c,#fff);transition:width .4s}
.tc-status{font-size:11px;color:var(--text2);margin-bottom:6px}
.tc-status strong{color:var(--text);font-weight:600}

/* CLASS AVERAGE BOX */
.avg-box{background:var(--surface2);border-radius:6px;padding:6px 8px;margin-top:4px;font-size:11px}
.avg-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.avg-label{color:var(--text3)}
.avg-val{font-weight:600;color:var(--text2)}
.avg-mini-track{flex:1;height:3px;background:var(--surface3);border-radius:99px;overflow:hidden}
.avg-mini-fill{height:100%;border-radius:99px;transition:width .5s}
.avg-count{font-size:10px;color:var(--text3);margin-top:2px;text-align:right}
.avg-loading{color:var(--text3);font-size:10px;font-style:italic}

/* QUIZ */
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;animation:fadeUp .3s ease both}
.btn-back{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'Sora',sans-serif;transition:color .15s,border-color .15s}
.btn-back:hover{color:var(--text);border-color:var(--text3)}
.quiz-title{font-size:13px;font-weight:600;color:var(--text)}
.quiz-sub{font-size:11px;color:var(--text2)}
.quiz-score-pill{margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text)}
.q-progress{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:18px;animation:fadeUp .3s .05s ease both}
.q-progress-fill{height:100%;border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;animation:fadeUp .3s .08s ease both}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.q-num{font-size:11px;color:var(--text3)}
.q-tag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid}
.tag-N{color:#3ecf8e;border-color:rgba(62,207,142,.3);background:rgba(62,207,142,.08)}
.tag-D{color:#60a5fa;border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.08)}
.q-text{font-family:'Fraunces',serif;font-size:17px;font-weight:400;color:var(--text);line-height:1.55;margin-bottom:18px}
.q-options{display:flex;flex-direction:column;gap:8px}
.opt-btn{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-family:'Sora',sans-serif;font-size:13.5px;color:var(--text2);text-align:left;width:100%;transition:background .12s,border-color .12s,color .12s;line-height:1.5}
.opt-btn:hover:not(:disabled){background:var(--surface3);border-color:var(--text3);color:var(--text)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{background:var(--green-bg);border-color:var(--green-border);color:#d1fae5;animation:pulseGreen .3s ease}
.opt-btn.wrong{background:var(--red-bg);border-color:var(--red-border);color:#fecaca;animation:shake .4s ease}
.opt-btn.reveal{background:var(--green-bg);border-color:var(--green-border);color:#d1fae5}
.opt-letter{width:22px;height:22px;min-width:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text3);background:var(--surface3);margin-top:1px;transition:background .12s,border-color .12s,color .12s}
.opt-btn.correct .opt-letter,.opt-btn.reveal .opt-letter{background:rgba(62,207,142,.25);border-color:var(--green);color:var(--green)}
.opt-btn.wrong .opt-letter{background:rgba(242,107,107,.2);border-color:var(--red);color:var(--red)}
.feedback{margin-top:12px;padding:12px 14px;border-radius:var(--rs);font-size:12.5px;line-height:1.65;animation:fadeUp .3s ease both}
.feedback.ok{background:var(--green-bg);border:1px solid var(--green-border);color:#a7f3d0}
.feedback.ko{background:var(--red-bg);border:1px solid var(--red-border);color:#fecaca}
.q-nav{display:flex;justify-content:flex-end;margin-top:14px;animation:fadeUp .3s .12s ease both}
.btn-next{display:flex;align-items:center;gap:6px;padding:10px 20px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Sora',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn-next:hover{background:var(--surface3);border-color:var(--text3)}
.btn-next:active{transform:scale(.97)}
.btn-next.primary{background:var(--c,var(--surface2));border-color:transparent;color:#fff}
.btn-next.primary:hover{filter:brightness(1.1)}

/* RESULT */
.result-back{display:flex;align-items:center;gap:10px;margin-bottom:18px;animation:fadeUp .3s ease both}
.result-header{font-size:13px;font-weight:600}
.result-sub{font-size:11px;color:var(--text2)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px 20px 22px;text-align:center;margin-bottom:14px;animation:fadeUp .3s .05s ease both}
.result-ring{width:100px;height:100px;margin:0 auto 14px;position:relative}
.result-ring svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface3);stroke-width:8}
.ring-fill{fill:none;stroke-width:8;stroke-linecap:round}
.result-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-score{font-size:22px;font-weight:700;line-height:1}
.ring-total{font-size:11px;color:var(--text2);margin-top:2px}
.result-pct{font-size:13px;color:var(--text2);margin-bottom:6px}
.result-msg{font-size:13.5px;color:var(--text2);line-height:1.65;max-width:380px;margin:0 auto 14px}

/* COMPARISON BOX */
.compare-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 16px;margin-bottom:18px;font-size:12.5px}
.compare-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.compare-label{color:var(--text2)}
.compare-val{font-weight:600}
.compare-bar-wrap{height:4px;background:var(--surface3);border-radius:99px;overflow:hidden;margin-top:4px;position:relative}
.compare-bar-class{position:absolute;top:0;left:0;height:100%;border-radius:99px;background:var(--text3);transition:width .8s}
.compare-bar-me{position:absolute;top:0;left:0;height:100%;border-radius:99px;transition:width .8s .1s}
.compare-legend{display:flex;gap:12px;margin-top:6px;font-size:11px;color:var(--text3)}
.compare-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.compare-verdict{margin-top:10px;font-size:12px;font-style:italic}

.result-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn-action{padding:9px 18px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Sora',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.btn-action:hover{background:var(--surface3);border-color:var(--text3)}
.btn-action.accent{background:var(--c,var(--surface2));border-color:transparent;color:#fff}
.btn-action.accent:hover{filter:brightness(1.1)}

/* REVIEW */
.review-toggle{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-family:'Sora',sans-serif;font-size:12.5px;color:var(--text2);margin-bottom:10px;transition:background .15s,color .15s}
.review-toggle:hover{background:var(--surface2);color:var(--text)}
.review-item{background:var(--surface);border:1px solid var(--red-border);border-radius:var(--rs);padding:14px;margin-bottom:8px;animation:fadeUp .25s ease both}
.ri-meta{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ri-q{font-size:13.5px;font-weight:500;color:var(--text);margin-bottom:8px;line-height:1.5}
.ri-ans{font-size:12px;color:var(--text2);line-height:1.7}
.ri-ans .wrong-ans{color:var(--red)}
.ri-ans .right-ans{color:var(--green)}
.ri-ans .expl{color:var(--text3);font-style:italic}

/* DASHBOARD */
.dash-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;animation:fadeUp .3s ease both}
.dash-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
.dash-sub{font-size:12px;color:var(--text2);margin-top:2px}
.dash-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.dash-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:14px;text-align:center}
.dash-stat-val{font-size:24px;font-weight:700;margin-bottom:2px}
.dash-stat-lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.dash-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px;animation:fadeUp .3s .08s ease both}
.dash-table{width:100%;border-collapse:collapse;font-size:12.5px}
.dash-table th{background:var(--surface2);padding:10px 12px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);border-bottom:1px solid var(--border)}
.dash-table td{padding:9px 12px;border-bottom:1px solid rgba(38,51,84,.5);color:var(--text2)}
.dash-table tr:last-child td{border-bottom:none}
.dash-table tr:hover td{background:var(--surface2)}
.dash-table .avg-row-highlight td{background:var(--surface2);color:var(--text);font-weight:600;border-top:1px solid var(--border)}
.pct-pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.pct-high{background:rgba(62,207,142,.15);color:#3ecf8e}
.pct-mid{background:rgba(250,204,21,.1);color:#facc15}
.pct-low{background:rgba(242,107,107,.1);color:var(--red)}
.dash-empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:13px}

/* ─── LANDING ──────────────────────────────────────────────── */
.landing-wrap{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 16px;animation:fadeUp .5s ease both}
.landing-badge{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:18px}
.landing-title{font-family:'Fraunces',serif;font-size:38px;font-weight:600;color:var(--text);line-height:1.1;margin-bottom:10px}
.landing-sub{font-size:13px;color:var(--text2);margin-bottom:28px;line-height:1.6}
.landing-countdown{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px}
.cd-block{display:flex;flex-direction:column;align-items:center;min-width:56px}
.cd-num{font-family:'Fraunces',serif;font-size:36px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;min-width:56px;text-align:center;line-height:1}
.cd-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:5px}
.cd-sep{font-size:28px;font-weight:700;color:var(--text3);line-height:1;margin-bottom:16px}
.landing-courage{font-family:'Fraunces',serif;font-size:22px;color:var(--text);margin-bottom:32px}
.landing-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:400px}
.landing-btn{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;font-family:'Sora',sans-serif;transition:border-color .2s,transform .15s,background .15s;position:relative;overflow:hidden}
.landing-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.landing-btn-hg::before{background:linear-gradient(90deg,#7F77DD,#3B82F6)}
.landing-btn-fr::before{background:linear-gradient(90deg,#a78bfa,#34d399)}
.landing-btn:hover{transform:translateY(-2px);border-color:var(--text3)}
.landing-btn:active{transform:scale(.98)}
.landing-btn-icon{font-size:26px;line-height:1}
.landing-btn-label{font-size:15px;font-weight:600;color:var(--text);margin-bottom:2px}
.landing-btn-sub{font-size:12px;color:var(--text2)}
.landing-btn-arrow{margin-left:auto;font-size:18px;color:var(--text3);transition:transform .2s}
.landing-btn:hover .landing-btn-arrow{transform:translateX(4px);color:var(--text)}

/* ─── MAIN NAV + SUB NAV ───────────────────────────────────── */
.main-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;animation:fadeUp .3s ease both}
.home-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s,transform .1s;flex-shrink:0}
.home-btn:hover{background:var(--surface3);border-color:var(--text3);transform:scale(1.08)}
.main-tabs{flex:1;display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px}
.main-tab{flex:1;padding:7px 12px;border-radius:99px;border:none;background:transparent;color:var(--text2);font-family:'Sora',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.main-tab:hover{color:var(--text)}
.main-tab.active{background:var(--surface2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sub-nav{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:3px;margin-bottom:18px;animation:fadeUp .3s .04s ease both}
.sub-tab{flex:1;padding:6px 10px;border-radius:99px;border:none;background:transparent;color:var(--text3);font-family:'Sora',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.sub-tab:hover{color:var(--text2)}
.sub-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* TAB NAV (legacy, kept for compat) */
.tab-nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px;margin-bottom:20px;animation:fadeUp .3s ease both}
.tab-btn{flex:1;padding:8px 12px;border-radius:99px;border:none;background:transparent;color:var(--text2);font-family:'Sora',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{background:var(--surface2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tab-btn-soon{opacity:.65;position:relative}
.tab-btn-soon::after{content:'bientôt';position:absolute;top:-7px;right:2px;font-size:8px;font-weight:600;letter-spacing:.04em;color:#facc15;text-transform:uppercase}

/* REVISION */
/* ─── JEUX HG ─────────────────────────────────────────────── */
.jx-pick-header{margin-bottom:18px;animation:fadeUp .3s ease both}
.jx-pick-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--text);margin-bottom:4px}
.jx-pick-sub{font-size:12px;color:var(--text2)}
.jx-game-list{display:flex;flex-direction:column;gap:12px}
.jx-game-card{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gc,var(--border));border-radius:var(--r);cursor:pointer;font-family:'Sora',sans-serif;text-align:left;transition:transform .15s,background .15s}
.jx-game-card:hover{transform:translateX(3px);background:var(--surface2)}
.jx-game-icon{font-size:26px;line-height:1;flex-shrink:0}
.jx-game-info{flex:1}
.jx-game-name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px}
.jx-game-desc{font-size:12px;color:var(--text2)}
.jx-game-arrow{font-size:16px;color:var(--text3);transition:transform .2s}
.jx-game-card:hover .jx-game-arrow{transform:translateX(4px)}
.jx-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.jx-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--text)}
.jx-frise-hint{font-size:12px;color:var(--text2);margin-bottom:12px;padding:8px 12px;background:var(--surface2);border-radius:var(--rs);border:1px solid var(--border)}
.jx-frise-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.jx-frise-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);cursor:grab;transition:background .15s,border-color .15s;user-select:none;touch-action:none}
.jx-frise-item:active{cursor:grabbing;background:var(--surface2)}
.jx-frise-item.jx-correct{border-color:#34d39966;background:#34d39910}
.jx-frise-item.jx-wrong{border-color:#f4727866;background:#f4727810}
.jx-frise-handle{font-size:14px;color:var(--text3);flex-shrink:0}
.jx-frise-content{flex:1;min-width:0}
.jx-frise-date{font-size:11px;font-weight:700;color:#7F77DD;margin-bottom:2px}
.jx-frise-text{font-size:13px;color:var(--text);line-height:1.4}
.jx-frise-corr{font-size:11px;color:#f47278;margin-top:3px}
.jx-frise-num{width:24px;height:24px;min-width:24px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text2)}
.jx-check-btn{width:100%;padding:13px;border-radius:var(--r);border:none;background:linear-gradient(135deg,#7F77DD,#3B82F6);color:#fff;font-family:'Sora',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}
.jx-check-btn:hover{opacity:.9;transform:translateY(-1px)}
.jx-result-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;text-align:center;margin-top:14px}
.jx-result-score{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--text);margin-bottom:4px}
.jx-result-pct{font-size:13px;color:var(--text2);margin-bottom:14px}
.jx-result-bar{width:100%;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:16px;border:1px solid var(--border)}
.jx-result-fill{height:100%;background:linear-gradient(90deg,#7F77DD,#34d399);border-radius:99px}
.jx-retry-btn{padding:10px 20px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);font-family:'Sora',sans-serif;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;margin:4px;transition:background .15s}
.jx-retry-btn:hover{background:var(--surface3)}
.jx-back-btn{color:var(--text2)}
.jx-vf-score-row{display:flex;justify-content:center;gap:16px;margin-bottom:14px}
.jx-vf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px 18px;text-align:center}
.jx-vf-badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:14px}
.jx-vf-question{font-family:'Fraunces',serif;font-size:17px;color:var(--text);line-height:1.5;margin-bottom:22px}
.jx-vf-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jx-vf-btn{padding:14px;border-radius:var(--r);border:1px solid var(--border);font-family:'Sora',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s,background .15s}
.jx-vf-btn:active{transform:scale(.96)}
.jx-vf-true-btn{background:var(--surface2);color:#34d399;border-color:#34d39944}
.jx-vf-true-btn:hover{background:#34d39914}
.jx-vf-false-btn{background:var(--surface2);color:#f47278;border-color:#f4727844}
.jx-vf-false-btn:hover{background:#f4727814}
.jx-vf-exp{margin:0 0 16px;padding:14px;border-radius:var(--rs);text-align:left}
.jx-vf-exp.jx-vf-true{background:#34d39910;border:1px solid #34d39944}
.jx-vf-exp.jx-vf-false{background:#f4727810;border:1px solid #f4727844}
.jx-vf-verdict{font-size:13px;font-weight:700;margin-bottom:6px}
.jx-vf-exp.jx-vf-true .jx-vf-verdict{color:#34d399}
.jx-vf-exp.jx-vf-false .jx-vf-verdict{color:#f47278}
.jx-vf-exptext{font-size:12.5px;color:var(--text2);line-height:1.6}
.jx-vf-next{width:100%;padding:12px;border-radius:var(--r);border:none;background:linear-gradient(135deg,#34d399,#059669);color:#fff;font-family:'Sora',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.jx-vf-result{text-align:center;padding:20px 0}
.jx-vf-trophy{font-size:52px;margin-bottom:12px}
/* ─── ENTRAÎNEMENT À L'ÉCRIT ──────────────────────────────── */
.fr-header-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.fr-ea-launch{background:#34d39914!important;border-color:#34d39944!important;color:#34d399!important}
.ea-pick-section{animation:fadeUp .3s ease both}

   {t:'N',q:'Qu\'est-ce qu\'une "superpuissance" ?',o:['Tout pays membre permanent de l\'ONU','Une nation dont l\'influence économique, culturelle, politique et militaire est prééminente à travers le monde','Un pays possédant l\'arme nucléaire','Une grande démocratie libérale occidentale'],c:1,e:'Une superpuissance est une nation dont l\'influence est prééminente à l\'échelle mondiale dans tous les domaines : économique (richesse, aide financière), culturelle (Hollywood et "American way of life" côté américain, cinéma et propagande côté soviétique), politique (blocs d\'alliance, ONU) et militaire (arsenaux nucléaires, course à l\'espace). États-Unis et URSS sont les deux superpuissances de la guerre froide.'},

   {t:'D',q:'La crise des missiles de Cuba se déroule en :',o:['1955','1959','1962','1968'],c:2,e:'En octobre 1962, la découverte de missiles soviétiques à Cuba provoque la crise la plus grave de la guerre froide.'},
   {t:'D',q:'La Chine populaire intègre le Conseil de sécurité de l\'ONU en :',o:['1955','1963','1971','1975'],c:2,e:'En 1971, la Chine populaire remplace Taiwan au Conseil de sécurité de l\'ONU.'},
   {t:'D',q:'Les accords d\'Helsinki sont signés en :',o:['1963','1968','1972','1975'],c:3,e:'Les accords d\'Helsinki (1975) visent à réduire les tensions Est-Ouest en reconnaissant les frontières européennes.'},
   {t:'D',q:'Le mur de Berlin tombe en :',o:['1985','1987','1989','1991'],c:2,e:'Le mur de Berlin tombe le 9 novembre 1989, symbole de la fin de la guerre froide.'},
   {t:'D',q:'La première guerre du Golfe se déroule en :',o:['1989','1991','1993','2001'],c:1,e:'La première guerre du Golfe (1991) voit une coalition internationale libérer le Koweït envahi par l\'Irak de Saddam Hussein.'},
   {t:'D',q:'Les attentats terroristes contre les États-Unis ont lieu en :',o:['1999','2001','2003','2005'],c:1,e:'Le 11 septembre 2001, des attentats frappent New York et Washington, déclenchant la "guerre contre le terrorisme".'},
  ]},
 {id:'h2',label:'Histoire – Thème 2',sub:'Vivre en France en démocratie depuis 1945',icon:'🗳️',color:'#3B82F6',
  q:[
   {t:'N',q:'Le Plan Marshall est :',o:['Un plan militaire américain pour défendre l\'Europe','Un programme d\'aide économique américain pour la reconstruction de l\'Europe après 1945','Un plan de décolonisation imposé par les États-Unis','Un accord franco-allemand de réconciliation'],c:1,e:'Le Plan Marshall (1947-1952) finance la reconstruction des économies européennes dévastées par la guerre.'},
   {t:'N',q:'La "démocratie libérale" désigne :',o:['Un régime où l\'État contrôle entièrement l\'économie','Un régime fondé sur la séparation des pouvoirs, les libertés individuelles et le suffrage universel','Un régime où seul le parti libéral peut gouverner','Un système économique de libre-échange sans État'],c:1,e:'La démocratie libérale repose sur les libertés fondamentales, la séparation des pouvoirs et des élections libres au suffrage universel.'},
   {t:'N',q:'La "démocratie sociale" se distingue par :',o:['L\'absence totale d\'État dans l\'économie','L\'affirmation de droits sociaux (protection sociale, droit du travail) complétant les libertés politiques','Le contrôle par l\'État de tous les moyens de production','L\'interdiction des partis d\'opposition'],c:1,e:'La démocratie sociale ajoute aux libertés politiques des droits économiques et sociaux. Elle est affirmée par le programme du CNR (1944).'},
   {t:'N',q:'L\'État-providence désigne :',o:['Un État qui n\'intervient que dans la défense nationale','Un État qui garantit à ses citoyens un ensemble de protections sociales','Un État géré par des technocrates sans légitimité démocratique','Un État qui contrôle l\'ensemble de l\'économie'],c:1,e:'L\'État-providence garantit des protections collectives : sécurité sociale, assurance chômage, retraites, allocations familiales.'},
   {t:'N',q:'Les "Trente Glorieuses" désignent :',o:['Les trente batailles décisives de la Seconde Guerre mondiale','La période 1945-1975 de forte croissance économique et de plein emploi en France','Les trente premières années de la Ve République','La période de reconstruction 1919-1939'],c:1,e:'Les Trente Glorieuses (1945-1975) sont une période de croissance économique exceptionnelle (~5% par an) et de plein emploi.'},
   {t:'N',q:'La "société de consommation" se caractérise par :',o:['Une société où seuls les plus aisés accèdent aux biens matériels','L\'accès généralisé à des biens matériels grâce à la hausse des revenus et à la production industrielle de masse','Une société où l\'État contrôle la distribution des biens','Une société rurale basée sur l\'autoproduction'],c:1,e:'La société de consommation se développe pendant les Trente Glorieuses : démocratisation de l\'automobile, de la télévision, des loisirs.'},
   {t:'N',q:'La Constitution de la Ve République (1958) instaure principalement :',o:['Un régime parlementaire avec un Parlement tout-puissant','Un régime semi-présidentiel renforçant le pouvoir exécutif et stabilisant les institutions','La suppression du droit de vote pour les femmes','L\'interdiction des partis communistes'],c:1,e:'La Constitution de 1958 instaure un régime semi-présidentiel qui renforce l\'exécutif face au Parlement.'},
   {t:'D',q:'En quelle année les femmes obtiennent-elles le droit de vote en France ?',o:['1936','1942','1944','1946'],c:2,e:'Les femmes obtiennent le droit de vote en 1944, par ordonnance du Gouvernement provisoire.'},
   {t:'D',q:'Le Salaire Minimum Interprofessionnel Garanti (SMIG) est créé en :',o:['1946','1950','1958','1962'],c:1,e:'Le SMIG est instauré en 1950 pour garantir un salaire minimum à tous les travailleurs.'},
   {t:'D',q:'La guerre d\'indépendance de l\'Algérie dure de :',o:['1945 à 1955','1954 à 1962','1958 à 1965','1962 à 1968'],c:1,e:'La guerre d\'Algérie (1954-1962) débute le 1er novembre 1954 et s\'achève par les accords d\'Évian.'},
   {t:'D',q:'La Ve République est proclamée en :',o:['1946','1954','1958','1962'],c:2,e:'La Ve République est proclamée le 4 octobre 1958, après l\'adoption de la nouvelle constitution par référendum.'},
   {t:'D',q:'L\'élection du président au suffrage universel direct est instaurée en :',o:['1958','1960','1962','1965'],c:2,e:'En 1962, une réforme constitutionnelle instaure l\'élection du président au suffrage universel direct.'},
   {t:'D',q:'Les grandes manifestations ouvrières et étudiantes de mai ont lieu en :',o:['1965','1968','1972','1975'],c:1,e:'Mai 1968 est une crise sociale majeure : grèves étudiantes puis grève générale des ouvriers (10 millions de grévistes).'},
   {t:'D',q:'La garantie de ressources pour les chômeurs est instaurée en :',o:['1968','1972','1974','1980'],c:2,e:'En 1974, face à la montée du chômage après le choc pétrolier de 1973, la France instaure une indemnisation renforcée des chômeurs.'},
   {t:'D',q:'Le droit de vote à 18 ans est accordé en :',o:['1968','1972','1974','1978'],c:2,e:'En 1974, sous Giscard d\'Estaing, l\'âge du droit de vote est abaissé de 21 à 18 ans.'},
   {t:'D',q:'La réforme Haby (collège unique et lycées professionnels) date de :',o:['1972','1975','1978','1982'],c:1,e:'La réforme Haby (1975) crée le collège unique et les lycées d\'enseignement professionnel (LEP).'},
   {t:'D',q:'La loi Veil sur l\'IVG est adoptée en :',o:['1972','1974','1975','1979'],c:2,e:'La loi Veil (1975) dépénalise l\'IVG après un débat très vif à l\'Assemblée nationale.'},
   {t:'D',q:'Les premières lois de décentralisation sont adoptées en :',o:['1978','1981','1982','1986'],c:2,e:'Les lois Defferre (1982) transfèrent des compétences importantes de l\'État vers les régions, départements et communes.'},
   {t:'D',q:'Les lois Auroux sur le droit du travail sont adoptées en :',o:['1978','1981','1982','1986'],c:2,e:'Les lois Auroux (1982) renforcent les droits des salariés dans l\'entreprise : droit d\'expression, négociation collective annuelle.'},
   {t:'D',q:'Le baccalauréat professionnel est créé en :',o:['1975','1980','1985','1992'],c:2,e:'Le baccalauréat professionnel est créé en 1985 pour valoriser les filières professionnelles.'},
   {t:'D',q:'Le traité de Maastricht est ratifié par la France en :',o:['1989','1991','1992','1993'],c:2,e:'Le traité de Maastricht est ratifié en 1992 (51,04% de oui). Il crée l\'Union européenne et programme la monnaie unique.'},
   {t:'D',q:'La loi sur la parité aux élections est adoptée en :',o:['1995','1998','2000','2004'],c:2,e:'La loi sur la parité (2000) oblige les partis à présenter autant de femmes que d\'hommes aux élections.'},
   {t:'D',q:'La charte de l\'environnement est adoptée en :',o:['2000','2002','2004','2007'],c:2,e:'La charte de l\'environnement (2004) est intégrée à la Constitution française. Elle inscrit droits et devoirs environnementaux.'},
  ]},
 {id:'g1',label:'Géographie – Thème 1',sub:'L\'accès aux ressources',icon:'💧',color:'#10B981',
  q:[
   {t:'N',q:'Dans le programme, les "ressources" désignent :',o:['Uniquement le pétrole et le gaz naturel','L\'ensemble des matières premières et éléments naturels exploités par les humains','Les ressources financières des États','Les ressources humaines des entreprises'],c:1,e:'Les ressources désignent toutes les matières naturelles exploitées : ressources minérales, énergétiques, forestières, hydrauliques…'},
   {t:'N',q:'La "disponibilité" d\'une ressource désigne :',o:['Le prix d\'une ressource sur le marché mondial','La quantité et la qualité d\'une ressource présente dans un territoire donné','La facilité d\'acheminement d\'une ressource','La durée de vie estimée d\'une ressource renouvelable'],c:1,e:'La disponibilité renvoie à la présence d\'une ressource en quantité et qualité suffisantes. Elle peut être menacée par la surexploitation ou la pollution.'},
   {t:'N',q:'L\'"accessibilité" d\'une ressource désigne :',o:['La quantité totale d\'une ressource disponible sur Terre','La capacité des populations à obtenir et utiliser une ressource (distance, prix, infrastructures)','Le coût de production d\'une ressource naturelle','Le droit international encadrant l\'exploitation des ressources'],c:1,e:'L\'accessibilité dépend du prix, de la distance et des inégalités sociales. Une ressource peut être disponible sans être accessible.'},
   {t:'N',q:'Un "conflit d\'usage" autour d\'une ressource désigne :',o:['Une guerre internationale pour s\'emparer d\'une ressource','Une concurrence entre différents acteurs revendiquant l\'utilisation d\'une même ressource','Un litige juridique entre une entreprise et l\'État','Un conflit diplomatique entre pays producteurs et pays consommateurs'],c:1,e:'Un conflit d\'usage naît quand plusieurs acteurs se disputent l\'accès à une ressource limitée, comme l\'eau, les terres ou les forêts.'},
   {t:'N',q:'Les "changements globaux" désignent :',o:['Les changements de gouvernements à l\'échelle mondiale','Les transformations des écosystèmes liées aux activités humaines et au changement climatique','Les mouvements migratoires à l\'échelle planétaire','Les réformes des grandes institutions internationales'],c:1,e:'Les changements globaux résultent de l\'anthropisation : changement climatique, érosion de la biodiversité, raréfaction des ressources non renouvelables.'},
   {t:'N',q:'Les 17 Objectifs de Développement Durable (ODD) sont :',o:['Des objectifs militaires définis par l\'OTAN','Des objectifs définis par l\'ONU en 2015 pour un développement mondial plus durable et équitable','Un accord entre pays industrialisés pour réduire leurs émissions de CO₂','Des indicateurs économiques utilisés par le FMI'],c:1,e:'Les 17 ODD sont adoptés par l\'ONU en septembre 2015. Ils couvrent la pauvreté, la faim, la santé, le climat, la biodiversité…'},
   {t:'N',q:'De "nouvelles formes d\'habiter" désignent dans le programme :',o:['La construction de nouveaux logements dans les grandes villes','Des façons de vivre et d\'occuper l\'espace adaptées aux défis des changements globaux','La réhabilitation des quartiers anciens des villes françaises','Les migrations de populations rurales vers les centres urbains'],c:1,e:'De nouvelles formes d\'habiter cherchent à réduire l\'empreinte environnementale : habitat éco-conçu, villes durables, mobilité douce.'},
   {t:'N',q:'Les "mobilités" désignent dans le programme :',o:['Uniquement les transports en commun dans les grandes villes','L\'ensemble des déplacements des personnes et des biens, à différentes échelles','La politique migratoire des États','Les flux de capitaux entre pays'],c:1,e:'Les mobilités regroupent tous types de déplacements : quotidiens, résidentiels, touristiques, migratoires… Repenser les mobilités est un enjeu majeur.'},
   {t:'N',q:'Un "territoire" en géographie désigne :',o:['Une surface délimitée par des frontières nationales uniquement','Un espace géographique approprié, aménagé et vécu par des sociétés humaines à différentes échelles','Un ensemble de ressources naturelles appartenant à un État','Une zone administrative soumise à des risques naturels'],c:1,e:'En géographie, un territoire est un espace organisé et approprié par des acteurs. Il peut être étudié à différentes échelles.'},
   {t:'N',q:'L\'"aménagement des territoires" désigne :',o:['L\'ensemble des politiques visant à organiser et développer l\'espace géographique de façon équilibrée','La construction d\'infrastructures militaires sur un territoire','La délimitation des frontières entre États souverains','La gestion des ressources naturelles par les entreprises privées'],c:0,e:'L\'aménagement du territoire recouvre les actions pour organiser l\'espace (logement, transports, zones d\'activité) dans une logique de développement équilibré.'},
   {t:'N',q:'Les "collectivités territoriales" sont :',o:['Les ambassades françaises à l\'étranger','Les structures administratives locales (régions, départements, communes) qui gèrent un territoire','Les grandes entreprises publiques françaises','Les institutions de l\'Union européenne'],c:1,e:'Les collectivités territoriales (régions, départements, communes) sont des entités locales disposant de compétences propres.'},
  ]},
 {id:'g2',label:'Géographie – Thème 2',sub:'Les sociétés et les risques',icon:'🌋',color:'#F59E0B',
  q:[
   {t:'N',q:'Un "risque" en géographie se définit comme :',o:['Un phénomène naturel inévitable et imprévisible','La combinaison d\'un aléa (phénomène dangereux) et de la vulnérabilité des populations exposées','Une catastrophe qui a déjà eu lieu dans un territoire','Un danger uniquement lié aux activités humaines'],c:1,e:'Le risque = aléa × vulnérabilité. Un tremblement de terre dans une zone déserte n\'est pas un risque ; il le devient quand des populations vulnérables y sont exposées.'},
   {t:'N',q:'Un "aléa" se définit comme :',o:['La probabilité qu\'un événement dangereux se produise et son intensité potentielle','Les dommages effectivement causés par une catastrophe','La politique de prévention mise en œuvre par un État','Le montant des indemnisations versées après une catastrophe'],c:0,e:'L\'aléa est le phénomène naturel (séisme, inondation, éruption…) susceptible de provoquer des dommages. Sa probabilité peut être évaluée scientifiquement.'},
   {t:'N',q:'Le "risque climatique" désigne :',o:['Uniquement les risques liés aux tempêtes et aux cyclones','L\'ensemble des risques aggravés ou créés par le changement climatique (sécheresses, inondations, submersions…)','Uniquement les risques présents dans les pays tropicaux','Les risques de conflits liés à la raréfaction des ressources'],c:1,e:'Le risque climatique regroupe les risques liés aux évolutions du climat : montée des eaux, canicules, sécheresses, événements extrêmes…'},
   {t:'N',q:'La "prévention" des risques consiste à :',o:['Réparer les dégâts causés par une catastrophe après qu\'elle s\'est produite','Anticiper les risques par des actions visant à réduire la vulnérabilité des populations et des territoires','Indemniser les victimes de catastrophes naturelles','Évacuer les populations après le déclenchement d\'une catastrophe'],c:1,e:'La prévention agit en amont : cartographie des risques, plans de prévention (PPR), éducation des populations, normes de construction.'},
   {t:'N',q:'La "gestion de crise" désigne :',o:['L\'ensemble des actions menées avant qu\'une catastrophe se produise','Les mesures prises pendant et immédiatement après une catastrophe pour secourir les victimes et limiter les dégâts','La politique d\'indemnisation des sinistrés','Les études scientifiques sur les causes d\'une catastrophe'],c:1,e:'La gestion de crise mobilise différents acteurs (État, collectivités, pompiers, associations…) pour coordonner les secours et organiser le retour à la normale.'},
   {t:'N',q:'L\'"adaptation" face aux risques désigne :',o:['Le refus d\'accepter les risques et la relocalisation systématique des populations','La capacité des sociétés à modifier leurs pratiques et leurs aménagements pour mieux vivre avec les risques sur le long terme','L\'aide internationale accordée aux pays les plus vulnérables','La privatisation de la gestion des risques naturels'],c:1,e:'L\'adaptation désigne la capacité à modifier les comportements et les infrastructures pour faire face aux risques durablement.'},
   {t:'N',q:'Une approche "systémique" des risques signifie :',o:['Étudier chaque risque indépendamment des autres','Considérer que les risques sont interconnectés et que leurs effets se combinent et se renforcent','Classer les risques par ordre de gravité','Confier la gestion de tous les risques à un seul organisme central'],c:1,e:'L\'approche systémique considère que les risques sont interdépendants : un aléa naturel peut déclencher un accident industriel (séisme → rupture de barrage → inondation + pollution).'},
   {t:'N',q:'Les "acteurs" dans la gestion des risques territoriaux sont :',o:['Uniquement l\'État et les préfets','L\'ensemble des intervenants : pouvoirs publics, collectivités, citoyens, entreprises et ONG','Seulement les pompiers et la protection civile','Exclusivement les organisations internationales (ONU, Croix-Rouge)'],c:1,e:'La gestion des risques mobilise de nombreux acteurs à différentes échelles : État, collectivités, entreprises, citoyens, ONG, ONU…'},
   {t:'N',q:"Dans le vocabulaire des risques, les « enjeux » désignent :",o:["Le phénomène dangereux qui peut se produire","Tout ce qui peut être touché : habitants, logements, entreprises, routes, environnement","Les sommes versées par les assurances","Les décisions prises par le préfet"],c:1,e:"Les enjeux sont ce qui peut être touché. Le risque naît de la rencontre d’un aléa et d’enjeux : sans enjeux, pas de risque."},
   {t:'N',q:"Un PPR (plan de prévention des risques) sert à :",o:["Organiser les secours pendant une catastrophe","Repérer les zones exposées et fixer des règles, par exemple pour construire","Indemniser les victimes après une catastrophe","Prévoir la météo des prochains jours"],c:1,e:"Le PPR est un document officiel de l’État : il délimite les zones à risque (rouge, bleue…) et réglemente les constructions. C’est un outil de prévention."},
   {t:'N',q:"Sur quel site officiel peut-on connaître les risques de sa commune ?",o:["Vigicrues uniquement","Géorisques (georisques.gouv.fr)","Le site de Météo-France uniquement","Le site de l’ONU"],c:1,e:"Géorisques, site de l’État, donne la liste des risques naturels et technologiques d’une commune, une carte interactive et les zones couvertes par un PPR."},
   {t:'N',q:"La tempête Alex (Alpes-Maritimes, 2020) était-elle un phénomène exceptionnel ?",o:["Oui, il n’avait jamais autant plu en France","Non : c’est un épisode méditerranéen, un phénomène qui revient régulièrement (record : Anduze 2002, 687 mm)","Oui, car elle venait de l’océan Atlantique","Non, car elle n’a fait aucun dégât"],c:1,e:"Alex (près de 500 mm) était très violente mais pas le record. Il y a 3 à 6 épisodes méditerranéens par an : le risque était prévisible."},
   {t:'N',q:"Pourquoi la tempête Alex a-t-elle fait autant de dégâts ?",o:["Parce que la région n’a pas de rivière","Parce que beaucoup de maisons récentes avaient été construites en zone inondable","Parce que personne n’habite dans ces vallées","Parce que l’État a interdit les secours"],c:1,e:"La vulnérabilité vient de l’aménagement : dans la région, les zones inondables (10 % du territoire) abritent 19 % de la population."},
   {t:'N',q:"En Camargue, le rachat des salins par le Conservatoire du littoral (2011) a permis de créer :",o:["Un nouveau port industriel","Une zone-tampon : les zones humides stockent l’eau de mer lors des crues","Un grand barrage sur le Rhône","Une station de ski"],c:1,e:"La zone-tampon laisse la nature agir : les marais absorbent l’eau et protègent ce qui est derrière. C’est une solution d’adaptation, à côté des digues."},
   {t:'N',q:"Fukushima (2011) est l’exemple type d’un risque systémique car :",o:["Il s’agit seulement d’un séisme","Plusieurs aléas s’enchaînent : séisme → tsunami → accident nucléaire","La catastrophe n’a touché qu’une seule maison","Le Japon n’avait aucune prévention"],c:1,e:"Le séisme (magnitude 9) a provoqué un tsunami qui a inondé la centrale et entraîné un accident nucléaire : effet domino et conséquences durables."},
   {t:'N',q:"Dans les Antilles, la plaquette « Le cyclone » de Météo-France est un exemple de :",o:["Culture du risque : elle donne les bons gestes avant, pendant et après le cyclone","Gestion financière des catastrophes","Publicité touristique","Loi européenne"],c:0,e:"Informer la population fait partie de la prévention et développe la culture du risque. Mais le réchauffement rend les cyclones plus violents (Irma, 2017)."},
  ]},
 {id:'emc',label:'EMC',sub:'La vie démocratique : débat, délibération et prise de décision',icon:'⚖️',color:'#EC4899',
  q:[
   {t:'N',q:"Selon l’article 11 de la DDHC (1789), la liberté d’expression :",o:["Est absolue : on peut tout dire","Est un droit, mais on doit répondre de ses abus dans les cas prévus par la loi","N’existe que pour les journalistes","Est interdite sur internet"],c:1,e:"La liberté d’expression est « un des droits les plus précieux », mais l’injure, la diffamation, le harcèlement ou la provocation à la haine sont punis."},
   {t:'N',q:"Accuser publiquement quelqu’un d’un fait précis qui porte atteinte à son honneur, c’est :",o:["Une injure","Une diffamation","Un amendement","Un lobbying"],c:1,e:"La diffamation (loi de 1881) vise un fait précis. L’injure est une insulte sans fait précis."},
   {t:'N',q:"Le DSA, applicable depuis février 2024, est :",o:["Une loi française sur le vote","Un règlement européen qui oblige les plateformes à permettre le signalement et à retirer vite les contenus illicites","Un réseau social européen","Un traité de l’ONU"],c:1,e:"Le règlement sur les services numériques (DSA) impose aussi d’expliquer les règles de modération. Amende possible : jusqu’à 6 % du chiffre d’affaires mondial."},
   {t:'N',q:"La « bulle de filtres » désigne :",o:["Un filtre photo sur Instagram","Le fait de ne plus voir que des points de vue proches des siens, à cause des algorithmes","Un logiciel antivirus","Une loi qui censure internet"],c:1,e:"Les algorithmes de recommandation montrent surtout ce qui nous fait réagir ou confirme nos idées : la confrontation d’idées devient plus rare."},
   {t:'N',q:"Le biais de confirmation, c’est :",o:["Croire plus facilement ce qui va dans notre sens","Vérifier toutes ses sources","Changer d’avis facilement","Voter blanc"],c:0,e:"Ce biais est renforcé par la bulle de filtres et rend le débat plus difficile."},
   {t:'N',q:"Selon Habermas, une prise de parole démocratique doit être :",o:["Rapide, courte et drôle","Vraie, juste et sincère","Anonyme, virale et émotive","Écrite, signée et payante"],c:1,e:"Vraie (faits, preuves), juste (respect des autres), sincère (on veut échanger, pas manipuler) : c’est l’éthique de la discussion."},
   {t:'N',q:"Un deepfake est :",o:["Une vraie vidéo d’actualité","Un faux contenu (image, vidéo, voix) fabriqué avec l’intelligence artificielle","Un sondage d’opinion","Une pétition en ligne"],c:1,e:"Les deepfakes peuvent manipuler l’opinion, notamment pendant les élections, et font dominer l’émotion sur les faits."},
   {t:'N',q:"La Convention citoyenne pour le climat (2019-2020) réunissait :",o:["150 députés","150 citoyens tirés au sort","Les 27 chefs d’État européens","Les maires de France"],c:1,e:"C’est un exemple de démocratie délibérative : des citoyens informés par des experts ont débattu puis proposé des mesures."},
   {t:'N',q:"Lequel de ces dispositifs relève de la démocratie participative ?",o:["L’élection présidentielle","Un budget participatif où les habitants proposent et votent des projets","Le veto au Conseil de sécurité","Le 49.3"],c:1,e:"Pétitions au CESE, budgets participatifs (Grenoble depuis 2015), conseils de quartier : les citoyens sont associés aux décisions."},
   {t:'N',q:"Associations, ONG et syndicats forment :",o:["Le gouvernement","La société civile organisée","Le Conseil constitutionnel","Les partis politiques"],c:1,e:"La société civile organisée agit en dehors de l’État et des entreprises pour défendre des causes ou des intérêts."},

// Fisher-Yates shuffle of [0,1,2,3]
function shuffle4(){const a=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function generateShuffles(){return THEMES.map(th=>th.q.map(()=>shuffle4()));}
// Reset shuffles for one theme only (on retry)
function reshuffleTheme(ti){state.shuffles[ti]=THEMES[ti].q.map(()=>shuffle4());}

function save(){try{localStorage.setItem('qcm_hg_v3',JSON.stringify({a:state.answers,sh:state.shuffles,n:state.studentName,c:state.studentClass}));}catch(e){}}
function load(){try{const d=localStorage.getItem('qcm_hg_v3');if(d){const p=JSON.parse(d);
  // Remet les anciennes réponses à la bonne taille si des thèmes ou des questions ont été ajoutés
  state.answers=THEMES.map((t,ti)=>{const old=(p.a&&p.a[ti])||[];return t.q.map((_,qi)=>old[qi]===undefined?null:old[qi]);});
  state.shuffles=p.sh?THEMES.map((t,ti)=>t.q.map((_,qi)=>(p.sh[ti]&&p.sh[ti][qi])||shuffle4())):null;
  state.studentName=p.n||null;state.studentClass=p.c||null;}}catch(e){}}

// ─── FIREBASE ────────────────────────────────────────────────────
function initFirebase(){
  if(!FIREBASE_ON)return;
  try{
    firebase.initializeApp(CONFIG.firebase);
    fbDb=firebase.database();
    listenAverages();
  }catch(e){console.warn('Firebase init error:',e);}
}

function listenAverages(){
  if(!fbDb)return;
  fbDb.ref('scores').on('value',snap=>{
    const data=snap.val()||{};
    const avgs={};
    THEMES.forEach(th=>{
      const d=data[th.id]||{};
      const vals=Object.values(d).map(v=>v.pct).filter(v=>typeof v==='number');
      if(vals.length>0){avgs[th.id]={avg:Math.round(vals.reduce((a,b)=>a+b,0)/vals.length),count:vals.length};}
    });
    state.classAverages=avgs;
    if(state.screen==='home')renderHome(document.getElementById('app'));
    if(state.screen==='result')renderResult(document.getElementById('app'));
  });
}

function submitScore(ti){
  if(!fbDb||!state.studentName)return;
  const th=THEMES[ti];
  const {s}=themeScore(ti);
  const pct=Math.round((s/th.q.length)*100);
  const key=sanitizeKey((state.studentName+'_'+(state.studentClass||''))).substring(0,30)||'eleve';
  fbDb.ref('scores/'+th.id+'/'+key).set({name:state.studentName,cls:state.studentClass||'',s,t:th.q.length,pct}).catch(()=>{});
}

function sanitizeKey(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');}

function renderDashboard(app){
  if(!FIREBASE_ON){
    app.innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--text2)"><p style="font-size:24px;margin-bottom:12px">🔧</p><p>Firebase non configuré.<br>Ajoutez vos identifiants Firebase dans la section CONFIG du code.</p></div>`;
    return;
  }
  app.innerHTML=`<div class="dash-header"><div><div class="dash-title">📊 Tableau de bord</div><div class="dash-sub">Scores de la classe — accès enseignant</div></div></div><div style="color:var(--text2);font-size:13px;display:flex;align-items:center;gap:6px"><span class="spinner"></span>Chargement des données…</div>`;
  fbDb.ref('scores').once('value',snap=>{
    const data=snap.val()||{};
    const studentMap={};
    THEMES.forEach(th=>{
      const d=data[th.id]||{};
      Object.entries(d).forEach(([key,v])=>{
        if(!studentMap[key])studentMap[key]={name:v.name||key,cls:v.cls||''};
        studentMap[key][th.id]=v.pct;
      });
    });
    const students=Object.values(studentMap);
    if(students.length===0){
      app.innerHTML=`<div class="dash-header"><div><div class="dash-title">📊 Tableau de bord</div><div class="dash-sub">Scores de la classe</div></div></div><div class="dash-empty">Aucun résultat pour l'instant.<br>Les scores apparaîtront ici dès que vos élèves auront fait le QCM.</div>`;
      return;
    }
    // Sort by name
    students.sort((a,b)=>a.name.localeCompare(b.name));
    // Compute averages
    const themeAvgs={};
    THEMES.forEach(th=>{
      const vals=students.map(s=>s[th.id]).filter(v=>v!==undefined);
      themeAvgs[th.id]=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
    });
    const globalAvgs=students.map(s=>{
      const v=THEMES.map(th=>s[th.id]).filter(v=>v!==undefined);
      return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;
    }).filter(v=>v!==null);
    const globalAvg=globalAvgs.length?Math.round(globalAvgs.reduce((a,b)=>a+b,0)/globalAvgs.length):null;

    function pill(pct){
      if(pct===undefined||pct===null)return '<span style="color:var(--text3)">—</span>';
      const cls=pct>=70?'pct-high':pct>=50?'pct-mid':'pct-low';
      return `<span class="pct-pill ${cls}">${pct}%</span>`;
    }

    let rows='';
    students.forEach(s=>{
      const myVals=THEMES.map(th=>s[th.id]).filter(v=>v!==undefined);
      const myAvg=myVals.length?Math.round(myVals.reduce((a,b)=>a+b,0)/myVals.length):null;
      rows+=`<tr><td style="color:var(--text);font-weight:500">${s.name}</td><td style="color:var(--text2)">${s.cls||'—'}</td>${THEMES.map(th=>`<td>${pill(s[th.id])}</td>`).join('')}<td>${pill(myAvg)}</td></tr>`;
    });

    app.innerHTML=`
    <div class="dash-header">
      <div><div class="dash-title">📊 Tableau de bord</div><div class="dash-sub">Scores de la classe · ${students.length} élève${students.length>1?'s':''}</div></div>
    </div>
    <div class="dash-summary">
      <div class="dash-stat"><div class="dash-stat-val">${students.length}</div><div class="dash-stat-lbl">Élèves</div></div>
      ${globalAvg!==null?`<div class="dash-stat"><div class="dash-stat-val" style="color:#3ecf8e">${globalAvg}%</div><div class="dash-stat-lbl">Moyenne globale</div></div>`:''}
      ${THEMES.map(th=>themeAvgs[th.id]!==null?`<div class="dash-stat"><div class="dash-stat-val" style="color:${th.color}">${themeAvgs[th.id]}%</div><div class="dash-stat-lbl">${th.icon} ${th.id.toUpperCase()}</div></div>`:'').join('')}
    </div>
    <div class="dash-table-wrap">
      <table class="dash-table">
        <thead><tr><th>Élève</th><th>Classe</th>${THEMES.map(th=>`<th>${th.icon} ${th.id.toUpperCase()}</th>`).join('')}<th>Moy.</th></tr></thead>
        <tbody>
          ${rows}
          <tr class="avg-row-highlight"><td>Moyenne classe</td><td>—</td>${THEMES.map(th=>`<td>${pill(themeAvgs[th.id])}</td>`).join('')}<td>${pill(globalAvg)}</td></tr>
        </tbody>
      </table>
    </div>
    <p style="font-size:11px;color:var(--text3);text-align:center">Les données se mettent à jour en temps réel dès que des élèves soumettent leurs réponses.</p>`;
  });
}

// ─── SCORE HELPERS ───────────────────────────────────────────────
function globalScore(){let s=0,t=0;THEMES.forEach((th,ti)=>th.q.forEach((_,qi)=>{if(state.answers[ti][qi]!==null){t++;if(state.answers[ti][qi]===th.q[qi].c)s++;}}));return{s,t};}
function themeScore(ti){let s=0,t=0;THEMES[ti].q.forEach((_,qi)=>{if(state.answers[ti][qi]!==null){t++;if(state.answers[ti][qi]===THEMES[ti].q[qi].c)s++;}});return{s,t};}
function themeDone(ti){return state.answers[ti].filter(a=>a!==null).length;}
function totalQ(){return THEMES.reduce((a,t)=>a+t.q.length,0);}

  const now=new Date();
  const diff=target-now;
  const days=Math.max(0,Math.floor(diff/(1000*60*60*24)));
  const hours=Math.max(0,Math.floor((diff%(1000*60*60*24))/(1000*60*60)));
  const mins=Math.max(0,Math.floor((diff%(1000*60*60))/(1000*60)));
  const secs=Math.max(0,Math.floor((diff%(1000*60))/1000));

  app.innerHTML=`
  <div class="landing-wrap">
    <div class="landing-badge">Terminale Bac Pro</div>
    <div class="landing-title">Réviser le Bac</div>
    <div class="landing-sub">Épreuve d’Histoire-Géographie-EMC : mercredi 9 juin 2027</div>

      <div class="cd-block"><div class="cd-num" id="cd-d">${String(days).padStart(2,'0')}</div><div class="cd-lbl">jours</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-h">${String(hours).padStart(2,'0')}</div><div class="cd-lbl">heures</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-m">${String(mins).padStart(2,'0')}</div><div class="cd-lbl">min</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-s">${String(secs).padStart(2,'0')}</div><div class="cd-lbl">sec</div></div>
    </div>
    <div class="landing-courage">Bon courage ! 💪</div>
    <div class="landing-btns">
      <button class="landing-btn landing-btn-hg" onclick="switchTab('hg')">
        <span class="landing-btn-icon">🗺️</span>
        <div><div class="landing-btn-label">Histoire-Géographie</div><div class="landing-btn-sub">QCM · Cours · EMC · Jeux</div></div>
        <span class="landing-btn-arrow">→</span>
      </button>
      <button class="landing-btn landing-btn-fr" onclick="switchTab('francais')">
        <span class="landing-btn-icon">📖</span>
        <div><div class="landing-btn-label">Français</div><div class="landing-btn-sub">Notions · Textes · Méthode</div></div>
        <span class="landing-btn-arrow">→</span>
      </button>
    </div>
  </div>`;

  if(window._cdTimer)clearInterval(window._cdTimer);
  window._cdTimer=setInterval(()=>{
    const n=new Date();const d=target-n;
    if(d<=0){clearInterval(window._cdTimer);return;}
    const dv=Math.floor(d/(1000*60*60*24));
    const hv=Math.floor((d%(1000*60*60*24))/(1000*60*60));
    const mv=Math.floor((d%(1000*60*60))/(1000*60));

    const el=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=String(v).padStart(2,'0');};
    el('cd-d',dv);el('cd-h',hv);el('cd-m',mv);el('cd-s',sv);
  },1000);
}

function renderRevision(app){
  let html=mainNav()+hgSubNav();
  html+=`<div class="rev-page-header">
    <div class="rev-page-title">Révisions Histoire-Géo</div>
    <div class="rev-page-sub">Vidéo + cours complet pour chaque thème du Bac Pro</div>
  </div>`;
  REVISIONS.forEach(r=>{
    const cours=COURS[r.id];
    html+=`<div class="revf-block" style="--rc:${r.color}">
      <div class="revf-header">
        <span class="revf-tag" style="background:${r.color}18;border-color:${r.color}44;color:${r.color}">${r.icon} ${r.label}</span>
        <div class="revf-title">${r.title}</div>
      </div>
      <div class="revf-video-thumb">
        <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="revf-video-link">
          <img src="https://img.youtube.com/vi/${r.videoId}/mqdefault.jpg" alt="${r.title}" class="revf-video-thumb-img">
          <div class="revf-play-btn">▶</div>
        </a>
      </div>
      <div class="revf-cours-toggle" onclick="toggleCours('${r.id}')">
        <span>📖 Voir le cours</span>
        <span class="revf-toggle-arrow" id="arrow-${r.id}">▸</span>
      </div>
      <div class="revf-cours-body" id="cours-${r.id}" style="display:none">
        ${cours.sections.map(sec=>`
          <div class="revf-section">
            <div class="revf-section-title">${sec.title}</div>
            <div class="revf-items">
              ${sec.items.map(([k,v])=>`
                <div class="revf-item">
                  <div class="revf-item-key" style="color:${r.color}">${k}</div>
                  <div class="revf-item-val">${v}</div>
                </div>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  });
  app.innerHTML=html;
}

function toggleCours(id){
  const body=document.getElementById('cours-'+id);
  const arrow=document.getElementById('arrow-'+id);
  const open=body.style.display==='none';
  body.style.display=open?'block':'none';
  arrow.style.transform=open?'rotate(90deg)':'';
}

function toggleFrSection(id){
  const body=document.getElementById('frbody-'+id);
  const arrow=document.getElementById('frarrow-'+id);
  const card=document.getElementById('frsec-'+id);
  const open=body.style.display==='none';
  body.style.display=open?'block':'none';

  card.classList.toggle('fr-open',open);
}

    </div>` : `<div class="fc-actions-hint">Retourne la carte pour voir les boutons</div>`}
  </div>`;
}

function startDeck(id){
  let cards=[];
  if(id==='all') FC_DECKS.forEach(d=>cards.push(...d.cards));
  else cards=[...(FC_DECKS.find(d=>d.id===id)||FC_DECKS[0]).cards];
  // shuffle
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  fc={deck:id,cards,idx:0,flipped:false,known:[],toReview:[]};
  render();
}

function flipCard(){fc.flipped=!fc.flipped;render();}

function markCard(known){
  if(known) fc.known.push(fc.idx); else fc.toReview.push(fc.idx);
  fc.idx++;
  fc.flipped=false;
  if(fc.idx>=fc.cards.length){
    // Results
    const app=document.getElementById('app');
    const total=fc.cards.length;
    app.innerHTML=`<div class="fc-wrap">
      <div class="fc-result-title">🎉 Deck terminé !</div>
      <div class="fc-result-score">
        <div class="fc-result-num" style="color:#34d399">${fc.known.length}</div>
        <div class="fc-result-lbl">cartes maîtrisées</div>
      </div>
      <div class="fc-result-score">
        <div class="fc-result-num" style="color:#f472b6">${fc.toReview.length}</div>
        <div class="fc-result-lbl">cartes à revoir</div>
      </div>
      <div class="fc-result-bar">
        <div class="fc-result-fill" style="width:${Math.round(fc.known.length/total*100)}%"></div>
      </div>
      <div class="fc-result-pct">${Math.round(fc.known.length/total*100)} % de réussite</div>
      <div class="fc-result-btns">
        <button class="fc-rbtn fc-rbtn-retry" onclick="startDeck(fc.deck)">🔄 Recommencer</button>
        <button class="fc-rbtn fc-rbtn-review" onclick="startDeckReview()" ${fc.toReview.length===0?'disabled':''}>🔁 Revoir les ratés (${fc.toReview.length})</button>
        <button class="fc-rbtn" onclick="fc.deck=null;render()">← Choisir un deck</button>
      </div>
    </div>`;
  } else {
    render();
  }
}

function startDeckReview(){
  const missed=fc.toReview.map(i=>fc.cards[i]);
  for(let i=missed.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[missed[i],missed[j]]=[missed[j],missed[i]];}
  fc={...fc,cards:missed,idx:0,flipped:false,known:[],toReview:[]};
  render();
}
